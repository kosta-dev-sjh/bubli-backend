services:
  backend:
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://${RDS_HOSTNAME}:${RDS_PORT:-5432}/${RDS_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${RDS_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${RDS_PASSWORD}
      STORAGE_TYPE: ${STORAGE_TYPE:-s3}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      AWS_S3_BUCKET: ${S3_BUCKET_NAME}
      AI_CHAT_PROVIDER: ${AI_CHAT_PROVIDER:-bedrock-converse}
      AI_EMBEDDING_PROVIDER: ${AI_EMBEDDING_PROVIDER:-bedrock-titan}
      AI_EMBEDDING_DIMENSIONS: ${AI_EMBEDDING_DIMENSIONS:-1024}
